<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — حجوزاتي</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main class="narrow">
    <a class="logo" href="/">حجوزا<span>تي</span></a>
    <div class="card" style="margin-top:20px">
      <h1 style="font-size:1.5rem">تسجيل الدخول</h1>
      <form id="form" novalidate>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" dir="ltr" autocomplete="email" required />
        </div>
        <div class="field" id="pw-field">
          <label for="password">كلمة السر</label>
          <input id="password" type="password" dir="ltr" autocomplete="current-password" required />
        </div>
        <p id="error" class="error"></p>
        <button id="submit" class="btn block" type="submit">دخول</button>
      </form>
      <p style="margin-top:12px"><a href="#" id="forgot">نسيت كلمة السر؟</a></p>
      <p class="muted">ما عندك حساب؟ <a href="/signup.html">افتح حساب</a></p>
    </div>
  </main>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
