<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل الدخول — حجوزاتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="navbar"><a class="brand" href="/">حجوزاتي</a></header>
  <main class="auth">
    <form id="form" novalidate>
      <h1 class="large-title">تسجيل الدخول</h1>
      <p class="lede">لأصحاب المصالح.</p>
      <div class="group">
        <div class="row field-row"><label for="email">الإيميل</label>
          <input id="email" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com" required /></div>
        <div class="row field-row"><label for="password">كلمة السر</label>
          <input id="password" type="password" dir="ltr" autocomplete="current-password" required /></div>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div class="actions">
        <button class="btn large block" type="submit">دخول</button>
        <button class="btn plain block" type="button" id="forgot">نسيت كلمة السر</button>
      </div>
      <p class="section-foot" style="text-align:center;margin-top:12px">ما عندك حساب؟ <a href="/signup.html">افتح حساب</a></p>
    </form>
  </main>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
