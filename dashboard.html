<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم — حجوزاتي</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="logo" href="/">حجوزا<span>تي</span></a>
      <nav>
        <span id="biz-name" class="muted"></span>
        <button id="logout" class="btn ghost sm">خروج</button>
      </nav>
    </header>

    <!-- ============ Onboarding (first login, no business yet) ============ -->
    <section id="onboarding" class="narrow hidden" style="padding-top:0">
      <div class="card">
        <h1 style="font-size:1.4rem">أهلاً! خلّينا نجهّز مصلحتك</h1>
        <form id="onb-form" novalidate>
          <div class="field">
            <label for="onb-name">اسم المصلحة</label>
            <input id="onb-name" required maxlength="80" placeholder="مثلاً: صالون أحمد" />
          </div>
          <div class="field">
            <label for="onb-slug">رابط صفحة الحجز</label>
            <input id="onb-slug" dir="ltr" required maxlength="40" placeholder="ahmad-salon" />
            <div class="hint" id="onb-slug-hint">أحرف إنجليزية صغيرة، أرقام وشَرطة (-) فقط</div>
          </div>
          <div class="row">
            <div class="field">
              <label for="onb-phone">رقم واتساب المصلحة</label>
              <input id="onb-phone" type="tel" dir="ltr" placeholder="050-1234567" />
            </div>
            <div class="field">
              <label for="onb-category">المجال</label>
              <select id="onb-category">
                <option>صالون حلاقة</option>
                <option>صالون تجميل</option>
                <option>عيادة</option>
                <option>مدرّب / مدرّبة</option>
                <option>تصوير</option>
                <option>كراج</option>
                <option>أخرى</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="onb-staff">اسمك (أول موظف)</label>
            <input id="onb-staff" required maxlength="60" />
          </div>
          <p id="onb-error" class="error"></p>
          <button class="btn block" type="submit">إنشاء المصلحة</button>
        </form>
      </div>
    </section>

    <!-- ============ Main dashboard ============ -->
    <section id="app" class="dash hidden">
      <aside class="side" id="tabs">
        <button data-tab="appointments" class="active">📅 المواعيد</button>
        <button data-tab="services">✂️ الخدمات</button>
        <button data-tab="staff">👥 الموظفين</button>
        <button data-tab="hours">🕘 ساعات العمل</button>
        <button data-tab="settings">⚙️ الإعدادات</button>
      </aside>

      <div>
        <div class="share">
          <span>رابط الحجز:</span>
          <code id="share-link"></code>
          <button id="copy-link" class="btn sm">نسخ</button>
          <a id="open-link" class="btn ghost sm" target="_blank">فتح</a>
        </div>

        <!-- Appointments -->
        <div class="card tab" id="tab-appointments">
          <div class="stats" id="stats"></div>
          <div class="panel-head">
            <h2 style="margin:0">المواعيد</h2>
            <div class="row" style="flex:0 1 auto">
              <input id="appt-date" type="date" />
              <button id="add-appt" class="btn sm">+ موعد جديد</button>
            </div>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>الساعة</th><th>الزبون</th><th>الخدمة</th><th>الموظف</th><th>الحالة</th><th></th></tr></thead>
            <tbody id="appt-body"></tbody>
          </table></div>
        </div>

        <!-- Services -->
        <div class="card tab hidden" id="tab-services">
          <div class="panel-head">
            <h2 style="margin:0">الخدمات</h2>
            <button id="add-service" class="btn sm">+ خدمة جديدة</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>الخدمة</th><th>المدة</th><th>السعر</th><th>فعّالة</th><th></th></tr></thead>
            <tbody id="svc-body"></tbody>
          </table></div>
        </div>

        <!-- Staff -->
        <div class="card tab hidden" id="tab-staff">
          <div class="panel-head">
            <h2 style="margin:0">الموظفين</h2>
            <button id="add-staff" class="btn sm">+ موظف جديد</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>الاسم</th><th>فعّال</th><th></th></tr></thead>
            <tbody id="staff-body"></tbody>
          </table></div>
        </div>

        <!-- Hours -->
        <div class="card tab hidden" id="tab-hours">
          <div class="panel-head">
            <h2 style="margin:0">ساعات العمل</h2>
            <select id="hours-staff" style="max-width:220px"></select>
          </div>
          <div id="hours-rows"></div>
          <button id="save-hours" class="btn">حفظ</button>
        </div>

        <!-- Settings -->
        <div class="card tab hidden" id="tab-settings">
          <h2>الإعدادات</h2>
          <form id="settings-form">
            <div class="row">
              <div class="field"><label for="s-name">اسم المصلحة</label><input id="s-name" required maxlength="80" /></div>
              <div class="field"><label for="s-phone">رقم واتساب المصلحة</label><input id="s-phone" type="tel" dir="ltr" /></div>
            </div>
            <div class="field"><label for="s-address">العنوان</label><input id="s-address" maxlength="120" /></div>
            <div class="field"><label for="s-desc">وصف قصير</label><textarea id="s-desc" rows="2" maxlength="300"></textarea></div>
            <div class="row">
              <div class="field">
                <label for="s-interval">كل كم دقيقة في موعد؟</label>
                <select id="s-interval">
                  <option value="5">5</option><option value="10">10</option><option value="15">15</option>
                  <option value="20">20</option><option value="30">30</option><option value="60">60</option>
                </select>
              </div>
              <div class="field">
                <label for="s-notice">أقل وقت قبل الموعد (دقائق)</label>
                <input id="s-notice" type="number" min="0" max="10080" />
              </div>
              <div class="field">
                <label for="s-days">الحجز مفتوح لكم يوم قدّام؟</label>
                <input id="s-days" type="number" min="1" max="180" />
              </div>
            </div>
            <div class="field"><label><input id="s-wa" type="checkbox" style="width:auto" /> إرسال تأكيد وتذكير للزبائن على واتساب</label></div>
            <div class="field"><label><input id="s-notify" type="checkbox" style="width:auto" /> بلّغني على واتساب عند كل حجز جديد</label></div>
            <button class="btn" type="submit">حفظ الإعدادات</button>
          </form>
        </div>
      </div>
    </section>
  </div>

  <!-- Service dialog -->
  <dialog id="svc-dialog">
    <form id="svc-form" method="dialog">
      <h3 id="svc-title">خدمة جديدة</h3>
      <div class="field"><label for="svc-name">اسم الخدمة</label><input id="svc-name" required maxlength="80" /></div>
      <div class="row">
        <div class="field"><label for="svc-duration">المدة (دقائق)</label><input id="svc-duration" type="number" min="5" max="600" step="5" required value="30" /></div>
        <div class="field"><label for="svc-price">السعر (₪)</label><input id="svc-price" type="number" min="0" step="1" value="0" /></div>
      </div>
      <div class="field"><label for="svc-desc">وصف (اختياري)</label><input id="svc-desc" maxlength="200" /></div>
      <div class="row">
        <button class="btn" value="save">حفظ</button>
        <button class="btn ghost" value="cancel" formnovalidate>إلغاء</button>
      </div>
    </form>
  </dialog>

  <!-- Manual booking dialog -->
  <dialog id="appt-dialog">
    <form id="appt-form" method="dialog">
      <h3>موعد جديد (هاتفي / حضوري)</h3>
      <div class="field"><label for="ap-service">الخدمة</label><select id="ap-service"></select></div>
      <div class="field"><label for="ap-staff">الموظف</label><select id="ap-staff"></select></div>
      <div class="row">
        <div class="field"><label for="ap-date">التاريخ</label><input id="ap-date" type="date" /></div>
        <div class="field"><label for="ap-slot">الساعة</label><select id="ap-slot"></select></div>
      </div>
      <div class="row">
        <div class="field"><label for="ap-name">اسم الزبون</label><input id="ap-name" maxlength="60" /></div>
        <div class="field"><label for="ap-phone">رقم الجوال</label><input id="ap-phone" type="tel" dir="ltr" /></div>
      </div>
      <p id="ap-error" class="error"></p>
      <div class="row">
        <button class="btn" value="save">حجز</button>
        <button class="btn ghost" value="cancel" formnovalidate>إلغاء</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
