<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>افتح حساب — حجوزاتي</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="navbar"><a class="brand" href="/">حجوزاتي</a></header>
  <main class="auth">
    <form id="form" novalidate>
      <h1 class="large-title">افتح حساب</h1>
      <p class="lede">بعدها بتختار اسم لصفحة الحجز وبتضيف خدماتك.</p>
      <div class="group">
        <div class="row field-row"><label for="email">الإيميل</label>
          <input id="email" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com" required /></div>
        <div class="row field-row"><label for="password">كلمة السر</label>
          <input id="password" type="password" dir="ltr" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل" required /></div>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div class="actions">
        <button class="btn large block" type="submit">افتح الحساب</button>
        <a class="btn plain block" href="/login.html">عندي حساب</a>
      </div>
    </form>
    <div id="sent" class="confirm" hidden>
      <h1 class="large-title">تفقّد الإيميل</h1>
      <p class="muted" style="margin-top:8px">بعتنالك رابط تأكيد. اضغط عليه وبترجع لهون تكمّل تجهيز مصلحتك.</p>
    </div>
  </main>
  <script type="module" src="/src/pages/signup.js"></script>
</body>
</html>
